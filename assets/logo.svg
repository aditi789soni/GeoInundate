<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Globe background circle -->
  <circle cx="50" cy="50" r="42" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>

  <!-- Water Waves -->
  <path d="M 15 52 Q 32.5 44 50 52 T 85 52 L 85 85 Q 50 92 15 85 Z" fill="url(#grad1)" opacity="0.85"/>
  <path d="M 12 62 Q 31 54 50 62 T 88 62 L 88 88 Q 50 94 12 88 Z" fill="#1D4ED8" opacity="0.6"/>

  <!-- Satellite Orbit Ring -->
  <ellipse cx="50" cy="40" rx="40" ry="16" fill="none" stroke="url(#orbit)" stroke-width="2" stroke-dasharray="4,3" transform="rotate(-20 50 40)"/>

  <!-- Satellite Icon -->
  <g transform="translate(68, 18) rotate(35)">
    <!-- Solar Panels -->
    <rect x="-14" y="-3.5" width="8" height="7" rx="1" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
    <rect x="6" y="-3.5" width="8" height="7" rx="1" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
    <!-- Satellite Body -->
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <!-- Sensor lens -->
    <circle cx="0" cy="0" r="2" fill="#DC2626"/>
  </g>

  <!-- Radar pulse signal -->
  <path d="M 50 25 A 25 25 0 0 1 75 50" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
